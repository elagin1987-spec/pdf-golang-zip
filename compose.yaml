services:
  pdf:
    build:
      context: .
      target: runtime
    image: "${PDF_IMAGE:-pdf-compression:stage06}"
    init: true
    read_only: true
    user: "65532:65532"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:${NO_NEW_PRIVILEGES:-true}"]
    mem_limit: 2g
    cpu_period: 100000
    cpu_quota: 200000
    pids_limit: 128
    ports:
      - "${BIND_IP:-127.0.0.1}:${PORT:-8080}:8080"
    environment:
      ENABLE_LOSSY: "${ENABLE_LOSSY:-true}"
      PROCESSING_TIMEOUT: "${PROCESSING_TIMEOUT:-120s}"
      MAX_WORKERS: "${MAX_WORKERS:-2}"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m,mode=1777
      - /work/jobs:rw,noexec,nosuid,size=1200m,mode=1777
    stop_grace_period: 10s
